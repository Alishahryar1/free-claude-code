version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: increase
    commit-message:
      prefix: "patch"
    schedule:
      interval: "daily"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
