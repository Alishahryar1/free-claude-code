name: Post merge

env:
  CI_UV_VERSION: "0.12.13"
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: post-merge-main
  cancel-in-progress: false
  queue: max

jobs:
  warm-dependency-cache:
    name: Warm dependency cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-latest
          - os: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up CI environment
        id: environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}
          lookup-only: "true"

      - name: Save Python
        if: steps.environment.outputs.python-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.environment.outputs.python-path }}
          key: ${{ steps.environment.outputs.python-key }}

      - name: Restore compatible dependency cache
        if: steps.environment.outputs.dependencies-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.environment.outputs.dependencies-path }}
          key: ${{ steps.environment.outputs.dependencies-key }}
          restore-keys: ${{ steps.environment.outputs.dependencies-prefix }}

      - name: Warm dependency cache
        if: steps.environment.outputs.dependencies-hit != 'true'
        run: uv sync --locked --group dev --no-install-workspace

      - name: Save dependency cache
        if: steps.environment.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.environment.outputs.dependencies-path }}
          key: ${{ steps.environment.outputs.dependencies-key }}

  publish:
    name: Publish to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Fetch previous revision
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ubuntu-latest
          lookup-only: "true"

      - name: Detect release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          uv run --no-project --python "$(cat .python-version)" python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          head = os.environ["HEAD_SHA"]
          before = os.environ.get("BEFORE_SHA") or f"{head}^"
          def version(revision):
              result = subprocess.run(
                  ["git", "show", f"{revision}:pyproject.toml"],
                  check=True, capture_output=True, text=True,
              )
              return tomllib.loads(result.stdout)["project"]["version"]
          current, previous = version(head), version(before)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"changed={str(current != previous).lower()}\n")
          print(f"Release version: {previous} -> {current}")
          PY

      - name: Build and validate release
        if: steps.release.outputs.changed == 'true'
        run: |
          uv build --no-sources --out-dir "$RUNNER_TEMP/fcc-release"
          uv run --no-project --python "$(cat .python-version)" python scripts/validate_release.py "$RUNNER_TEMP/fcc-release"

      - name: Publish release
        if: steps.release.outputs.changed == 'true'
        run: uv publish --trusted-publishing always "$RUNNER_TEMP/fcc-release/"*
