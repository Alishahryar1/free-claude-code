name: Post merge

env:
  CI_UV_VERSION: "0.12.13"
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full main commit SHA to retry (defaults to this workflow commit)
        required: false
        type: string
  push:
    branches: [main]

concurrency:
  group: post-merge-main
  cancel-in-progress: false
  queue: max

jobs:
  warm-dependency-cache:
    name: Warm dependency cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-latest
          - os: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up CI environment
        id: environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}
          lookup-only: "true"
          sync-dependencies: "false"

      - name: Save Python
        if: steps.environment.outputs.python-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.environment.outputs.python-path }}
          key: ${{ steps.environment.outputs.python-key }}

      - name: Restore compatible dependency cache
        if: steps.environment.outputs.dependencies-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.environment.outputs.dependencies-path }}
          key: ${{ steps.environment.outputs.dependencies-key }}
          restore-keys: ${{ steps.environment.outputs.dependencies-prefix }}

      - name: Warm dependency cache
        if: steps.environment.outputs.dependencies-hit != 'true'
        run: uv sync --locked --group dev --no-install-workspace

      - name: Save dependency cache
        if: steps.environment.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.environment.outputs.dependencies-path }}
          key: ${{ steps.environment.outputs.dependencies-key }}

  publish:
    name: Publish to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ubuntu-latest
          lookup-only: "true"
          sync-dependencies: "false"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}
        run: |
          uv run --no-project --python "$(cat .python-version)" python -m scripts.publish_release \
            --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
