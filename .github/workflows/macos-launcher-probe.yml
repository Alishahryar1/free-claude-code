name: macOS launcher investigation

on:
  push:
    branches: [fix/macos-native-launcher]

env:
  CI_UV_VERSION: "0.12.13"
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-environment
        id: environment
        with:
          uv-version: "0.12.13"
          runner-label: ${{ matrix.runner }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.environment.outputs.dependencies-hit != 'true'
        with:
          path: ${{ steps.environment.outputs.dependencies-path }}
          key: ${{ steps.environment.outputs.dependencies-key }}
      - name: Run native desktop checks
        run: sh scripts/ci.sh --only macos-desktop
      - name: Check installer and uninstaller boundaries
        env:
          FCC_LIVE_SMOKE: "1"
        run: uv run --locked pytest smoke/installers -n 0 -q -k 'macos or removes_and_verifies_only_fcc or pins_selected_fcc_release'
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}
          path: test-results/native/

  sdist-rebuild:
    name: sdist rebuild (${{ matrix.runner }})
    needs: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - uses: ./.github/actions/ci-environment
        id: environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}
          sync-dependencies: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-macos-26
          path: test-results/native
      - name: Rebuild the Mac-produced sdist without a native compiler
        run: uv run --no-project --python ${{ steps.environment.outputs.python-version }} python smoke/desktop/rebuild_sdist.py test-results/native/dist

