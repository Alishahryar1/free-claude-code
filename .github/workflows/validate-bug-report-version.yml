name: Validate bug report version

on:
  issues:
    types: [opened, edited]

concurrency:
  group: bug-report-version-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate FCC version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = context.repo;
            const issue_number = context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({
              ...repo,
              issue_number,
            });
            const fieldPattern = "^### FCC version\\r?\\n+\\s*([^\\r\\n]+)";
            const releaseVersionPattern = "^v((?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*))$";
            const versionPattern = "(?:^|[^0-9A-Za-z_.])v?([0-9]+\\.[0-9]+\\.[0-9]+(?:\\.dev[0-9]+(?:\\+g[0-9a-f]+(?:\\.d[0-9]{8})?)?|\\+d[0-9]{8})?)(?![0-9A-Za-z_+-]|\\.[0-9A-Za-z_])";
            const parseReport = (body) => {
              const sections = body.split(/^### /m);
              const doctor = sections.filter((section) => /^FCC doctor output\r?\n/.test(section));
              if (doctor.length) {
                if (doctor.length !== 1) return { valid: false };
                let text = doctor[0].replace(/^FCC doctor output\r?\n/, "").trim();
                const fence = text.match(/^```(?:json)?\r?\n([\s\S]*)\r?\n```$/);
                if (fence) text = fence[1];
                let report;
                try { report = JSON.parse(text); }
                catch { return { valid: false }; }
                const version = report?.version;
                if (version === "0+unknown") return { valid: true };
                if (typeof version !== "string") return { valid: false };
                const matches = [...version.matchAll(new RegExp(versionPattern, "g"))];
                if (matches.length !== 1 || matches[0][0] !== version) return { valid: false };
                return { valid: true, reportedVersion: matches[0][1] };
              }
              const match = body.match(new RegExp(fieldPattern, "m"));
              if (!match && sections.some((section) => /^Installation issue\r?\n/.test(section))) {
                return { valid: true };
              }
              const fieldValue = match?.[1]?.trim() || "";
              const versionMatches = [...fieldValue.matchAll(new RegExp(versionPattern, "g"))];
              const reportedVersion = versionMatches.length === 1 ? versionMatches[0][1] : undefined;
              return { valid: reportedVersion !== undefined || fieldValue === "None", reportedVersion };
            };
            const { reportedVersion, valid } = parseReport(issue.body || "");
            const labelName = "needs-fcc-version";
            const invalidMarker = "<!-- fcc-version-validator -->";
            const outdatedMarker = "<!-- fcc-version-outdated -->";
            const labels = new Set(issue.labels.map((label) => label.name));

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...repo, issue_number, per_page: 100 },
            );
            const managedComment = (marker) => comments.find(
              (comment) => comment.user?.login === "github-actions[bot]"
                && comment.body?.includes(marker),
            );
            const invalidComment = managedComment(invalidMarker);
            const outdatedComment = managedComment(outdatedMarker);

            const deleteManagedComment = async (comment) => {
              if (comment === undefined) return;
              await github.rest.issues.deleteComment({
                ...repo,
                comment_id: comment.id,
              });
            };

            const isOlderVersion = (reported, latest) => {
              const reportedParts = reported.split(".").map((part) => BigInt(part));
              const latestParts = latest.split(".").map((part) => BigInt(part));
              for (let index = 0; index < reportedParts.length; index += 1) {
                if (reportedParts[index] < latestParts[index]) return true;
                if (reportedParts[index] > latestParts[index]) return false;
              }
              return false;
            };

            if (!valid) {
              await deleteManagedComment(outdatedComment);
              if (!labels.has(labelName)) {
                try {
                  await github.rest.issues.getLabel({ ...repo, name: labelName });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  try {
                    await github.rest.issues.createLabel({
                      ...repo,
                      name: labelName,
                      color: "d4c5f9",
                      description: "Bug report needs valid FCC version information",
                    });
                  } catch (createError) {
                    if (createError.status !== 422) throw createError;
                  }
                }
                await github.rest.issues.addLabels({
                  ...repo,
                  issue_number,
                  labels: [labelName],
                });
              }
              if (invalidComment === undefined) {
                await github.rest.issues.createComment({
                  ...repo,
                  issue_number,
                  body: `${invalidMarker}\nPlease run \`fcc-doctor\` and paste its complete JSON into **FCC doctor output**. For an older issue with an **FCC version** field, enter one version from \`fcc-server --version\` or exactly \`None\`. If FCC has not installed successfully, use the Installation problem form.`,
                });
              }
              return;
            }

            if (labels.has(labelName)) {
              await github.rest.issues.removeLabel({
                ...repo,
                issue_number,
                name: labelName,
              });
            }
            await deleteManagedComment(invalidComment);

            // Checkout versions identify development source, not published releases.
            if (reportedVersion === undefined || reportedVersion.includes(".dev") || reportedVersion.includes("+")) {
              await deleteManagedComment(outdatedComment);
              return;
            }

            let release;
            try {
              ({ data: release } = await github.rest.repos.getLatestRelease(repo));
            } catch (error) {
              if (error.status !== 404) throw error;
              await deleteManagedComment(outdatedComment);
              return;
            }
            const latestVersion = release.tag_name.match(new RegExp(releaseVersionPattern))?.[1];
            if (!latestVersion || release.draft || release.prerelease) {
              throw new Error("Latest release must have a stable vMAJOR.MINOR.PATCH tag");
            }

            if (!isOlderVersion(reportedVersion, latestVersion)) {
              await deleteManagedComment(outdatedComment);
              return;
            }

            const body = `${outdatedMarker}\nThis report uses FCC \`${reportedVersion}\`, while the latest published version is \`${latestVersion}\`. Please [update FCC](${context.payload.repository.html_url}#update), restart FCC, and check whether the issue still occurs. The update may already contain the fix.`;
            if (outdatedComment === undefined) {
              await github.rest.issues.createComment({
                ...repo,
                issue_number,
                body,
              });
            } else if (outdatedComment.body !== body) {
              await github.rest.issues.updateComment({
                ...repo,
                comment_id: outdatedComment.id,
                body,
              });
            }
