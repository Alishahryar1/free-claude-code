# Branch protection: require every status check this workflow reports, for example:
#   Ban suppressions and legacy annotations
#   ruff-format, ruff-check, ty
#   pytest (Linux), pytest (Windows), pytest (macOS)
#   playwright (Linux), playwright (Windows), playwright (macOS)
# GitHub may prefix with the workflow name (e.g. "CI / ruff-format"); use the names the branch protection UI offers after a run.

name: CI

env:
  CI_UV_VERSION: "0.12.13"
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-suppressions-or-legacy-annotations:
    name: Ban suppressions and legacy annotations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: "Fail on type ignores and legacy future annotations"
        run: |
          if grep -rE '# type: ignore|# ty: ignore|from __future__ import annotations' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments and legacy future annotations are not allowed. Fix the underlying type/import issue instead."
            exit 1
          fi
          exit 0

  quality:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ruff-format
            run: uv run --locked ruff format --check
          - id: ruff-check
            run: uv run --locked ruff check
          - id: ty
            run: uv run --locked ty check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ubuntu-latest

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run
        run: ${{ matrix.run }}

  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-latest
          - os: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --locked pytest -v --tb=short

  playwright:
    name: playwright (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-latest
          - os: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install Chromium
        run: uv run --locked playwright install --with-deps chromium

      - name: Run Playwright
        run: >-
          uv run --locked pytest e2e -v --tb=short
          --tracing=retain-on-failure --screenshot=only-on-failure
          --full-page-screenshot --output=test-results

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
