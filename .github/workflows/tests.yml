# Branch protection: require these stable checks, not individual shard jobs:
#   Ban suppressions and legacy annotations
#   ruff-format, ruff-check, ty
#   Version policy
#   pytest, playwright
# GitHub may prefix with the workflow name (e.g. "CI / ruff-format"); use the names the branch protection UI offers after a run.

name: CI

env:
  CI_UV_VERSION: "0.12.13"
  CI_PYTEST_SHARDS: "2"
  CI_PLAYWRIGHT_SHARDS: "3"
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-suppressions-or-legacy-annotations:
    name: Ban suppressions and legacy annotations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: "Fail on type ignores and legacy future annotations"
        run: |
          if grep -rE '# type: ignore|# ty: ignore|from __future__ import annotations' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments and legacy future annotations are not allowed. Fix the underlying type/import issue instead."
            exit 1
          fi
          exit 0

  quality:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ruff-format
            run: uv run --locked ruff format --check
          - id: ruff-check
            run: uv run --locked ruff check
          - id: ty
            run: uv run --locked ty check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ubuntu-latest

      - name: Run
        run: ${{ matrix.run }}

  prepare-shards:
    name: Prepare test shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pytest_matrix: ${{ steps.matrix.outputs.pytest_matrix }}
      playwright_matrix: ${{ steps.matrix.outputs.playwright_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Generate test matrices
        id: matrix
        run: |
          python scripts/ci_shards.py \
            --pytest-shards "$CI_PYTEST_SHARDS" \
            --playwright-shards "$CI_PLAYWRIGHT_SHARDS" >> "$GITHUB_OUTPUT"

  pytest-shards:
    name: pytest (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: prepare-shards
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-shards.outputs.pytest_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}
          prepare-node: "true"

      - name: Run pytest
        run: >-
          uv run --locked pytest -v --tb=short -o thread_dump_timeout=15 --durations=50
          --splits ${{ matrix.shards }} --group ${{ matrix.shard }}
          --splitting-algorithm=least_duration

  playwright-shards:
    name: playwright (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: prepare-shards
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-shards.outputs.playwright_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Set up CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: ${{ env.CI_UV_VERSION }}
          runner-label: ${{ matrix.runner }}

      - name: Install Chromium
        run: uv run --locked playwright install --only-shell ${{ matrix.os == 'Linux' && '--with-deps chromium' || 'chromium' }}

      - name: Run Playwright
        run: >-
          uv run --locked pytest e2e -v --tb=short
          -o thread_dump_timeout=10 --durations=20
          --tracing=retain-on-failure --screenshot=only-on-failure
          --full-page-screenshot --output=test-results
          --splits ${{ matrix.shards }} --group ${{ matrix.shard }}
          --splitting-algorithm=least_duration

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-${{ runner.os }}-${{ runner.arch }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  pytest-summary:
    name: pytest
    needs: [prepare-shards, pytest-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require successful preparation and every shard
        env:
          PREPARATION_RESULT: ${{ needs.prepare-shards.result }}
          SHARDS_RESULT: ${{ needs.pytest-shards.result }}
        run: |
          test "$PREPARATION_RESULT" = success && test "$SHARDS_RESULT" = success

  playwright-summary:
    name: playwright
    needs: [prepare-shards, playwright-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require successful preparation and every shard
        env:
          PREPARATION_RESULT: ${{ needs.prepare-shards.result }}
          SHARDS_RESULT: ${{ needs.playwright-shards.result }}
        run: |
          test "$PREPARATION_RESULT" = success && test "$SHARDS_RESULT" = success
