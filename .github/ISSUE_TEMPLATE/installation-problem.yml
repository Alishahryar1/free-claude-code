name: Installation problem
description: Report a problem before FCC has been installed successfully.
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Installation issue
      description: Describe what happened and include the terminal error you received. Attach the installer log shown in the final summary, if available. Output from interactive child installers appears only in the terminal. You can also attach screenshots here.
    validations:
      required: true
